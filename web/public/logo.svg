<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- Skew line pattern -->
  <g filter="url(#glow)" opacity="0.9">
    <line x1="30" y1="140" x2="70" y2="60" stroke="url(#line)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="y1" values="140;130;140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="60;50;60" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="55" y1="145" x2="95" y2="55" stroke="url(#line)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="y1" values="145;135;145" dur="3s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="y2" values="55;45;55" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    <line x1="80" y1="140" x2="120" y2="60" stroke="url(#line)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="y1" values="140;130;140" dur="3s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="y2" values="60;50;60" dur="3s" repeatCount="indefinite" begin="0.6s"/>
    </line>
    <line x1="105" y1="145" x2="145" y2="55" stroke="url(#line)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="y1" values="145;135;145" dur="3s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="y2" values="55;45;55" dur="3s" repeatCount="indefinite" begin="0.9s"/>
    </line>
    <line x1="130" y1="140" x2="170" y2="60" stroke="url(#line)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="y1" values="140;130;140" dur="3s" repeatCount="indefinite" begin="1.2s"/>
      <animate attributeName="y2" values="60;50;60" dur="3s" repeatCount="indefinite" begin="1.2s"/>
    </line>
  </g>
  <!-- Baseline -->
  <line x1="25" y1="155" x2="175" y2="155" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
</svg>
